  if(!email||!password){alert('Staff email and password are required.');return;}
  if(password.length<6){alert('Password must be at least 6 characters.');return;}
  try{
    if(!staffApp){staffApp=firebase.initializeApp(window.PHONEKING_FIREBASE_CONFIG,'staffCreator');staffAuth=staffApp.auth();}
    const cred=await staffAuth.createUserWithEmailAndPassword(email,password);
    await fbDb.ref('phoneking/users/'+cred.user.uid).set({role:'staff',name:name||email,email,createdAt:Date.now()});
    await staffAuth.signOut();
    closeModal();
    alert('Staff account created successfully.');
    render();
  }catch(e){alert(e.message||'Could not create staff account.');}
}

function status(n){return n===0?['Out of stock','red']:n<=2?['Low stock','orange']:['In stock','green']}
function searchMatch(model,q){const hay=normalizeKey(model),terms=normalizeKey(q).split(' ').filter(Boolean);return !terms.length||terms.every(t=>hay.includes(t))}
function counts(){return {all:data.products.length,in:data.products.filter(p=>p.stock>2).length,low:data.products.filter(p=>p.stock>0&&p.stock<=2).length,out:data.products.filter(p=>p.stock===0).length,total:data.products.reduce((a,p)=>a+(+p.stock||0),0)}}
function setStock(id,delta){if(role!=='manager')return;const p=data.products.find(x=>x.id===id);if(!p)return;const before=p.stock;p.stock=Math.max(0,p.stock+delta);log(`${p.model}: ${before} → ${p.stock}`);save();updateLiveResults()}
function confirmDelete(id){if(role!=='manager')return;const p=data.products.find(x=>x.id===id);if(!p)return;document.getElementById('modal').classList.add('show');document.getElementById('modal').innerHTML=`<div class="dialog confirm-dialog"><div class="confirm-icon">×</div><h2>Remove model?</h2><p class="muted">This will permanently remove <b>${escapeHtml(p.model)}</b> from your cover list. This action cannot be undone.</p><div class="actions" style="justify-content:flex-end;margin-top:18px"><button class="btn secondary" onclick="closeModal()">Cancel</button><button class="btn danger" onclick="deleteProduct(${id})">Permanently Remove</button></div></div>`}
function deleteProduct(id){if(role!=='manager')return;const p=data.products.find(x=>x.id===id);if(!p)return;data.products=data.products.filter(x=>x.id!==id);log(`Permanently removed ${p.model}`);closeModal();save();updateLiveResults()}
function escapeHtml(v){return String(v||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function nav(p){page=p;query='';filter='all';render()}
function searchLive(el){query=el.value;updateLiveResults()}
function updateLiveResults(){const box=document.querySelector('.live-results');if(!box)return;if(page==='glass'){box.innerHTML=glassResults()}else if(page==='stock'){box.innerHTML=productCards()}else if(page==='dashboard'){box.innerHTML=query?dashboardResults() : ''}}
function render(){if(!role){document.getElementById('root').innerHTML=login();return}document.getElementById('root').innerHTML=app();bind()}
function login(){return `<div class="login"><div class="loginbox"><div class="brand" style="color:#202124;font-size:24px">PHONE<span>KING</span></div><p class="muted">Secure Stock Management</p>${cloudReady?`<h2>Sign in</h2><div class="field full"><label>Email</label><input id="login_email" type="email" placeholder="manager@example.com" autocomplete="username"></div><div class="field full"><label>Password</label><input id="login_pass" type="password" placeholder="Password" autocomplete="current-password"></div><button class="btn primary" style="width:100%;margin-top:14px" onclick="cloudLogin(document.getElementById('login_email').value,document.getElementById('login_pass').value)">Login</button><p class="muted small" style="margin-top:12px">Manager access is controlled by Firebase authentication. Staff accounts are read-only.</p>`:`<h2>Firebase setup required</h2><p class="muted">Add your Firebase project settings to <b>firebase-config.js</b>, then reopen PhoneKing. The app is prepared for secure Manager/Staff login and live cloud sync.</p><div class="card"><b>Manager</b><br><span class="muted">Full access</span><br><br><b>Staff</b><br><span class="muted">View only</span></div>`}</div></div>`}
function app(){let content=page==='dashboard'?dashboard():page==='glass'?glass():page==='stock'?stock():page==='history'?history():staff();return `<div class="app"><header class="top"><div class="brand">PHONE<span>KING</span> <span style="color:#aaa;font-size:12px">STOCK</span></div><div class="role">${role==='manager'?'👤 Manager':'👁 Staff Viewer'} · <button style="border:0;background:transparent;color:#fff" onclick="logout()">Switch</button></div></header><div class="layout"><aside class="side">${navs()}</aside><main class="main">${content}</main></div><nav class="mobilebar">${navs(true)}</nav></div>`}
function navs(m=false){let items=[['dashboard','⌂','Dashboard'],['stock','▣','Covers'],['glass','◇','Glass'],['history','↻','History']];if(role==='manager')items.push(['staff','♙','Staff']);return items.map(x=>`<button class="nav ${page===x[0]?'active':''}" onclick="nav('${x[0]}')">${x[1]} ${x[2]}</button>`).join('')}
function dashboard(){return `<div class="head"><div><h1>Dashboard</h1><div class="muted">Fast model lookup for your shop</div></div>${role==='manager'?`<button class="btn primary" onclick="openProduct()">＋ Add Cover</button>`:''}</div><input class="search" id="mainSearch" placeholder="🔍  Search model..." oninput="searchLive(this)" value="${escapeHtml(query)}" autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false"><div class="home-cards"><button class="home-card" onclick="nav('stock')"><span style="display:flex;align-items:center;gap:12px"><span class="home-icon">📱</span><span><h3>Covers</h3><p>Manage cover models</p></span></span><span class="arrow">›</span></button><button class="home-card" onclick="nav('glass')"><span style="display:flex;align-items:center;gap:12px"><span class="home-icon">🛡</span><span><h3>Universal Glass</h3><p>Manage glass sets</p></span></span><span class="arrow">›</span></button></div><div class="section"><button class="btn secondary export-btn" onclick="exportOutOfStock()">⬇ Export Out-of-Stock Covers</button></div><div class="section"><div class="live-results"></div></div></div>`}
function dashboardResults(){const q=query.trim();const covers=data.products.filter(p=>searchMatch(p.model,q));const glasses=data.glasses.filter(g=>searchMatch([g.name,g.size,...g.models].join(' '),q));return `<div class="search-result-title"><h2>Search Results</h2><span>${covers.length+glasses.length} matches</span></div>${covers.length?`<div class="result-block"><div class="result-label">COVERS</div>${coverRows(covers,false,false)}</div>`:''}${glasses.length?`<div class="result-block"><div class="result-label">UNIVERSAL GLASS</div>${glassRows(glasses)}</div>`:''}${!covers.length&&!glasses.length?`<div class="empty">No model found.</div>`:''}`}
function coverRows(arr,showStock=true,showActions=true){return `<div class="cover-list">${arr.map(p=>coverRow(p,showStock,showActions)).join('')}</div>`}
function coverRow(p,showStock=true,showActions=true){return `<div class="cover-row"><div class="serial">${p.serial||''}</div><div class="cover-info"><div class="model-name" title="${escapeHtml(p.model)}">${escapeHtml(p.model)}</div>${showActions&&role==='manager'?`<div class="row-actions"><button class="icon-btn minus" onclick="setStock(${p.id},-1)" aria-label="Decrease stock">−</button><button class="icon-btn plus" onclick="setStock(${p.id},1)" aria-label="Increase stock">+</button><button class="icon-btn edit-btn" onclick="openEdit(${p.id})" aria-label="Edit model">✎</button><button class="delete-btn" onclick="confirmDelete(${p.id})" aria-label="Permanently remove model">×</button></div>`:''}</div>${showStock?`<div class="cover-stock"><div class="stock-number">${p.stock}</div><div class="stock-label">Stock</div></div>`:''}</div>`}
function productCards(){let arr=data.products.filter(p=>{const match=searchMatch(p.model,query);const f=filter==='all'||(filter==='in'&&p.stock>2)||(filter==='low'&&p.stock>0&&p.stock<=2)||(filter==='out'&&p.stock===0);return match&&f});if(!arr.length)return `<div class="empty">No cover models found.</div>`;return coverRows(arr)}
function stock(){const c=counts();return `<div class="head"><div><h1>Covers</h1><div class="muted">Manage cover stock by model · ${data.products.length} models</div></div>${role==='manager'?`<div class="head-actions"><button class="btn primary" onclick="openProduct()">＋ Add Model</button></div>`:''}</div><input class="search" id="mainSearch" placeholder="🔍 Smart search model..." oninput="searchLive(this)" value="${escapeHtml(query)}" autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false"><div class="filters"><button class="filter ${filter==='all'?'active':''}" onclick="filter='all';render()">All <b>${c.all}</b></button><button class="filter ${filter==='in'?'active':''}" onclick="filter='in';render()">Stock <b>${c.in}</b></button><button class="filter ${filter==='low'?'active':''}" onclick="filter='low';render()">Low Stock <b>${c.low}</b></button><button class="filter ${filter==='out'?'active':''}" onclick="filter='out';render()">Out of Stock <b>${c.out}</b></button></div><div class="live-results">${productCards()}</div></div>`}
function glass(){return `<div class="head"><div><h1>Universal Glass</h1><div class="muted">Search any compatible model to find its glass set</div></div>${role==='manager'?`<div class="head-actions"><button class="btn primary" onclick="openGlass()">＋ Add Set</button></div>`:''}</div><input class="search" id="mainSearch" placeholder="🔍 Smart search model or glass set..." oninput="searchLive(this)" value="${escapeHtml(query)}" autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false"><div class="section live-results">${glassResults()}</div>`}
function glassResults(){let arr=data.glasses.filter(g=>!query.trim()||searchMatch([g.name,g.size,...g.models].join(' '),query));if(!arr.length)return `<div class="empty">No glass set found.</div>`;return `<div class="cover-list">${arr.map((g,i)=>glassRow(g,i+1)).join('')}</div>`}
function glassRow(g,serial){return `<div class="glass-row"><div class="serial">${serial}</div><div class="glass-info"><div class="model-name" title="${escapeHtml(g.name)}">${escapeHtml(g.name)}</div><div class="muted">Size: ${escapeHtml(g.size)}</div><div class="glass-models">${g.models.map(m=>`<span class="tag">${escapeHtml(m)}</span>`).join('')}</div>${role==='manager'?`<div class="glass-actions"><button class="icon-btn edit-btn" onclick="openGlassEdit(${g.id})" aria-label="Edit glass set">✎</button><button class="delete-btn" onclick="confirmGlassDelete(${g.id})" aria-label="Permanently remove glass set">×</button></div>`:''}</div></div>`}
function glassRows(arr){return `<div class="cover-list">${arr.map((g,i)=>glassRow(g,i+1)).join('')}</div>`}
function history(compact=false){let h=data.history.slice(0,compact?5:100);return h.length?`<div class="history">${h.map(e=>`<div class="event"><b>${escapeHtml(e.text)}</b><div class="muted">${escapeHtml(e.at)}</div></div>`).join('')}</div>`:`<div class="empty">No stock changes yet.</div>`}
function staff(){
  return `<div class="head"><div><h1>Staff Access</h1><div class="muted">Create and manage read-only staff accounts</div></div>${role==='manager'?`<button class="btn primary" onclick="openStaff()">＋ Add Staff</button>`:''}</div><div class="card"><h3>Staff Viewer</h3><p class="muted">Staff can search and view the latest cover stock and universal-glass compatibility. They cannot add, edit, delete, or change stock.</p><div class="tag">VIEW ONLY</div><div class="tag">LIVE DATA</div></div><div class="section"><h3>Staff Accounts</h3><div id="staffList" class="staff-list"><div class="muted">Loading staff accounts…</div></div></div></div>`
}
function openProduct(){document.getElementById('modal').classList.add('show');document.getElementById('modal').innerHTML=`<div class="dialog"><div class="modalhead"><h2>Add Cover Model</h2><button class="close" onclick="closeModal()">×</button></div><div class="formgrid"><div class="field full"><label>Model</label><input id="f_model" placeholder="OPPO A79 5G" autocomplete="off"></div><div class="field full"><label>Opening stock</label><input id="f_stock" type="number" min="0" value="0"></div></div><button class="btn primary" style="width:100%;margin-top:16px" onclick="addProduct()">Add Model</button></div>`}
async function openStaff(){
  if(role!=='manager')return;
  document.getElementById('modal').classList.add('show');
  document.getElementById('modal').innerHTML=`<div class="dialog"><div class="modalhead"><h2>Add Staff</h2><button class="close" onclick="closeModal()">×</button></div><div class="formgrid"><div class="field full"><label>Staff name</label><input id="s_name" placeholder="e.g. Ahmed" autocomplete="name"></div><div class="field full"><label>Email</label><input id="s_email" type="email" placeholder="staff@example.com" autocomplete="username"></div><div class="field full"><label>Temporary password</label><input id="s_pass" type="password" placeholder="Minimum 6 characters" autocomplete="new-password"></div></div><p class="muted small" style="margin-top:12px">The staff member will sign in with this email and password and will have view-only access.</p><button class="btn primary" style="width:100%;margin-top:16px" onclick="cloudSignupStaff(document.getElementById('s_email').value,document.getElementById('s_pass').value,document.getElementById('s_name').value)">Create Staff Account</button></div>`;
  setTimeout(()=>document.getElementById('s_name')?.focus(),50)
}
async function loadStaffList(){
  const el=document.getElementById('staffList'); if(!el||role!=='manager'||!cloudReady)return;
  try{
    const snap=await fbDb.ref('phoneking/users').once('value'); const vals=snap.val()||{};
    const rows=Object.entries(vals).filter(([uid,v])=>v&&v.role==='staff').sort((a,b)=>(a[1].name||a[1].email||'').localeCompare(b[1].name||b[1].email||''));
    el.innerHTML=rows.length?rows.map(([uid,v])=>`<div class="card staff-row"><div><b>${escapeHtml(v.name||'Staff')}</b><div class="muted small">${escapeHtml(v.email||'')}</div></div><span class="tag">VIEW ONLY</span></div>`).join(''):`<div class="muted">No staff accounts yet.</div>`;
  }catch(e){el.innerHTML='<div class="muted">Unable to load staff accounts.</div>'}
}
function openEdit(id){if(role!=='manager')return;const p=data.products.find(x=>x.id===id);if(!p)return;document.getElementById('modal').classList.add('show');document.getElementById('modal').innerHTML=`<div class="dialog"><div class="modalhead"><h2>Edit Cover Model</h2><button class="close" onclick="closeModal()">×</button></div><div class="formgrid"><div class="field full"><label>Model</label><input id="e_model" value="${escapeHtml(p.model)}" autocomplete="off"></div><div class="field full"><label>Stock</label><input id="e_stock" type="number" min="0" value="${p.stock}"></div></div><button class="btn primary" style="width:100%;margin-top:16px" onclick="saveEdit(${id})">Save Changes</button></div>`;setTimeout(()=>document.getElementById('e_model')?.focus(),50)}
function saveEdit(id){if(role!=='manager')return;const p=data.products.find(x=>x.id===id);if(!p)return;const model=document.getElementById('e_model').value.trim();const stock=Math.max(0,+document.getElementById('e_stock').value||0);if(!model){alert('Model is required.');return}const key=normalizeKey(model);const duplicate=data.products.find(x=>x.id!==id&&normalizeKey(x.model)===key);if(duplicate){duplicate.stock+=stock;data.products=data.products.filter(x=>x.id!==id);log(`Merged ${p.model} into ${duplicate.model}: stock +${stock}`)}else{const before=p.stock;p.model=model;p.stock=stock;log(`Edited ${model}: stock ${before} → ${stock}`)}data.products.forEach((x,i)=>x.serial=i+1);save();closeModal();updateLiveResults()}
function addProduct(){const model=f_model.value.trim();const stock=Math.max(0,+f_stock.value||0);if(!model){alert('Model is required.');return}const key=normalizeKey(model);const existing=data.products.find(x=>normalizeKey(x.model)===key);if(existing){existing.stock+=stock;log(`Updated existing ${existing.model}: stock +${stock}`)}else{data.products.push({id:Date.now(),serial:data.products.reduce((m,p)=>Math.max(m,+p.serial||0),0)+1,type:'cover',name:'Silicone Cloth',brand:'',model,stock});log(`Added ${model} with stock ${stock}`)}save();closeModal();query='';filter='all';render()}
function openGlass(){document.getElementById('modal').classList.add('show');document.getElementById('modal').innerHTML=`<div class="dialog"><div class="modalhead"><h2>Add Universal Glass Set</h2><button class="close" onclick="closeModal()">×</button></div><div class="formgrid"><div class="field"><label>Set name</label><input id="g_name" placeholder="UG-024"></div><div class="field"><label>Size</label><input id="g_size" placeholder="6.5\""></div><div class="field full"><label>Compatible models (one per line)</label><textarea id="g_models" placeholder="Samsung A15\nSamsung A16\nRedmi Note 13"></textarea></div></div><button class="btn primary" style="width:100%;margin-top:16px" onclick="addGlass()">Add Glass Set</button></div>`}
function addGlass(){let g={id:Date.now(),name:g_name.value.trim(),size:g_size.value.trim(),models:g_models.value.split('\n').map(x=>x.trim()).filter(Boolean)};if(!g.name||!g.size||!g.models.length){alert('Set name, size and at least one model are required.');return}data.glasses.push(g);log(`Added universal glass ${g.name}`);save();closeModal();render()}
function openGlassEdit(id){if(role!=='manager')return;const g=data.glasses.find(x=>x.id===id);if(!g)return;document.getElementById('modal').classList.add('show');document.getElementById('modal').innerHTML=`<div class="dialog"><div class="modalhead"><h2>Edit Universal Glass Set</h2><button class="close" onclick="closeModal()">×</button></div><div class="formgrid"><div class="field"><label>Set name</label><input id="eg_name" value="${escapeHtml(g.name)}" autocomplete="off"></div><div class="field"><label>Size</label><input id="eg_size" value="${escapeHtml(g.size)}" autocomplete="off"></div><div class="field full"><label>Compatible models (one per line)</label><textarea id="eg_models">${escapeHtml(g.models.join('\n'))}</textarea></div></div><button class="btn primary" style="width:100%;margin-top:16px" onclick="saveGlassEdit(${id})">Save Changes</button></div>`}
function saveGlassEdit(id){if(role!=='manager')return;const g=data.glasses.find(x=>x.id===id);if(!g)return;const name=document.getElementById('eg_name').value.trim(),size=document.getElementById('eg_size').value.trim(),models=[...new Set(document.getElementById('eg_models').value.split('\n').map(x=>x.trim()).filter(Boolean))];if(!name||!size||!models.length){alert('Set name, size and at least one model are required.');return}g.name=name;g.size=size;g.models=models;log(`Edited universal glass ${name}`);save();closeModal();updateLiveResults()}
function confirmGlassDelete(id){if(role!=='manager')return;const g=data.glasses.find(x=>x.id===id);if(!g)return;document.getElementById('modal').classList.add('show');document.getElementById('modal').innerHTML=`<div class="dialog confirm-dialog"><div class="confirm-icon">×</div><h2>Remove glass set?</h2><p class="muted">This will permanently remove <b>${escapeHtml(g.name)}</b> and its compatible-model list. This action cannot be undone.</p><div class="actions" style="justify-content:flex-end;margin-top:18px"><button class="btn secondary" onclick="closeModal()">Cancel</button><button class="btn danger" onclick="deleteGlass(${id})">Permanently Remove</button></div></div>`}
function deleteGlass(id){if(role!=='manager')return;const g=data.glasses.find(x=>x.id===id);if(!g)return;data.glasses=data.glasses.filter(x=>x.id!==id);log(`Permanently removed universal glass ${g.name}`);save();closeModal();updateLiveResults()}
function exportOutOfStock(){const rows=data.products.filter(p=>+p.stock===0);const header=['Serial','Model','Stock'];const csv=[header,...rows.map((p,i)=>[i+1,p.model,0])].map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\r\n');const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`phoneking-out-of-stock-covers-${new Date().toISOString().slice(0,10)}.csv`;document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url)}
function closeModal(){document.getElementById('modal').classList.remove('show');document.getElementById('modal').innerHTML=''}function logout(){if(cloudReady&&fbAuth){fbAuth.signOut();return}role='';render()}function bind(){const input=document.getElementById('mainSearch');if(input&&document.activeElement!==input&&query)input.focus()}
document.body.insertAdjacentHTML('beforeend','<div id="modal" class="modal"></div>'); if(cloudReady) startCloud(); else render();
</script></body></html>
