function normalizeKey(v){return String(v||'').trim().toLowerCase().replace(/[^a-z0-9]+/g,' ').replace(/\s+/g,' ').trim()}
function uniqModels(arr){const seen=new Set();return arr.map(x=>String(x||'').trim()).filter(x=>x).filter(x=>{const k=normalizeKey(x);if(seen.has(k))return false;seen.add(k);return true})}
function normalizeData(d){d=d||{};const seen=new Map(),products=[];(d.products||[]).forEach((p,i)=>{const model=String(p.model||p.name||'').trim();if(!model)return;const key=normalizeKey(model);if(seen.has(key)){seen.get(key).stock+=(+p.stock||0)}else{const n={id:p.id||Date.now()+i,type:'cover',model,stock:Math.max(0,+p.stock||0),serial:products.length+1};seen.set(key,n);products.push(n)}});return {products,glasses:(d.glasses||[]).map(g=>({id:g.id||Date.now(),name:String(g.name||'').trim(),size:String(g.size||'').trim(),models:uniqModels(g.models||[])})),history:d.history||[]}}

function highlightText(text,q){let s=escapeHtml(text);const terms=[...new Set(normalizeKey(q).split(' ').filter(Boolean))].sort((a,b)=>b.length-a.length);if(!terms.length)return s;terms.forEach(t=>{const re=new RegExp('('+t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','ig');s=s.replace(re,'<mark class="match">$1</mark>')});return s}

function addProduct(){const model=document.getElementById('f_model').value.trim(),stock=Math.max(0,+document.getElementById('f_stock').value||0);if(!model)return alert('Model is required.');const key=normalizeKey(model),existing=data.products.find(x=>normalizeKey(x.model)===key);if(existing){const before=existing.stock;existing.stock+=stock;saveData();writeAudit('Cover updated','Cover: '+existing.model,`Stock ${before} → ${existing.stock}`)}else{data.products.push({id:Date.now(),type:'cover',model,stock,serial:data.products.length+1});saveData();writeAudit('Model added','Cover: '+model,`Opening stock ${stock}`)}closeModal();render()}
function openEdit(id){if(!canWrite())return;const p=data.products.find(x=>x.id==id);if(!p)return;openModal(`<div class="dialog"><div class="modalhead"><h2>Edit Cover Model</h2><button class="close" onclick="closeModal()">×</button></div><div class="formgrid"><div class="field full"><label>Model</label><input id="e_model" value="${escapeHtml(p.model)}"></div><div class="field full"><label>Stock</label><input id="e_stock" type="number" min="0" value="${p.stock}"></div></div><button class="btn primary" style="width:100%;margin-top:16px" onclick="saveEdit(${id})">Save Changes</button></div>`)}
function saveEdit(id){if(!canWrite())return;const p=data.products.find(x=>x.id==id);if(!p)return;const model=document.getElementById('e_model').value.trim(),stock=Math.max(0,+document.getElementById('e_stock').value||0);if(!model)return alert('Model is required.');const dup=data.products.find(x=>x.id!=id&&normalizeKey(x.model)===normalizeKey(model));if(dup){dup.stock+=stock;p.stock=0;data.products=data.products.filter(x=>x.id!=id).map((x,i)=>({...x,serial:i+1}));writeAudit('Models merged','Cover: '+model,`Merged into ${dup.model}; added ${stock} stock`)}else{const before=p.model+' / '+p.stock;p.model=model;p.stock=stock;writeAudit('Cover edited','Cover: '+model,`${before} → ${model} / ${stock}`)}saveData();closeModal();render()}
function openGlass(){if(!canWrite())return;openModal(`<div class="dialog"><div class="modalhead"><h2>Add Universal Glass Set</h2><button class="close" onclick="closeModal()">×</button></div><div class="formgrid"><div class="field"><label>Set name</label><input id="g_name" placeholder="UG-024"></div><div class="field"><label>Size</label><input id="g_size" placeholder="6.5\""></div><div class="field full"><label>Compatible models</label><textarea id="g_models" placeholder="Type models separated by comma (,), or one per line"></textarea><div class="mini-note" style="margin-top:6px">Example: Samsung A15, Samsung A16, Redmi Note 13</div></div></div><button class="btn primary" style="width:100%;margin-top:16px" onclick="addGlass()">Add Glass Set</button></div>`)}
function addGlass(){const name=document.getElementById('g_name').value.trim(),size=document.getElementById('g_size').value.trim(),models=parseModels(document.getElementById('g_models').value);if(!name||!size||!models.length)return alert('Set name, size and at least one model are required.');const existing=data.glasses.find(g=>normalizeKey(g.name)===normalizeKey(name));if(existing){existing.models=uniqModels(existing.models.concat(models));existing.size=size;writeAudit('Glass set updated','Glass: '+name,`Added ${models.length} model(s)`)}else{data.glasses.push({id:Date.now(),name,size,models});writeAudit('Glass set added','Glass: '+name,`${models.length} compatible model(s)`)}saveData();closeModal();render()}
function openGlassEdit(id){if(!canWrite())return;const g=data.glasses.find(x=>x.id==id);if(!g)return;openModal(`<div class="dialog"><div class="modalhead"><h2>Edit Universal Glass Set</h2><button class="close" onclick="closeModal()">×</button></div><div class="formgrid"><div class="field"><label>Set name</label><input id="eg_name" value="${escapeHtml(g.name)}"></div><div class="field"><label>Size</label><input id="eg_size" value="${escapeHtml(g.size)}"></div><div class="field full"><label>Compatible models</label><textarea id="eg_models">${escapeHtml(g.models.join(', '))}</textarea><div class="mini-note" style="margin-top:6px">All models are displayed directly on the card. Comma-separated input is supported.</div></div></div><button class="btn primary" style="width:100%;margin-top:16px" onclick="saveGlassEdit(${id})">Save Changes</button></div>`)}
function saveGlassEdit(id){if(!canWrite())return;const g=data.glasses.find(x=>x.id==id);if(!g)return;const name=document.getElementById('eg_name').value.trim(),size=document.getElementById('eg_size').value.trim(),models=parseModels(document.getElementById('eg_models').value);if(!name||!size||!models.length)return alert('Set name, size and at least one model are required.');g.name=name;g.size=size;g.models=models;saveData();writeAudit('Glass set edited','Glass: '+name,`${models.length} compatible model(s)`);closeModal();render()}
function confirmGlassDelete(id){if(!canWrite())return;const g=data.glasses.find(x=>x.id==id);if(!g)return;openModal(`<div class="dialog confirm"><div class="confirm-icon">×</div><h2>Remove glass set?</h2><p class="muted">Permanently remove <b>${escapeHtml(g.name)}</b> and its compatible-model list?</p><div class="head-actions" style="justify-content:center;margin-top:17px"><button class="btn secondary" onclick="closeModal()">Cancel</button><button class="btn danger" onclick="deleteGlass(${id})">Permanently Remove</button></div></div>`)}
function deleteGlass(id){if(!canWrite())return;const g=data.glasses.find(x=>x.id==id);if(!g)return;data.glasses=data.glasses.filter(x=>x.id!=id);saveData();writeAudit('Glass set deleted','Glass: '+g.name,'Permanently removed');closeModal();render()}
function coverRows(arr,showStock=true){return `<div class="cover-list">${arr.map(p=>`<div class="cover-row"><div class="serial">${p.serial||''}</div><div class="cover-info"><div class="model-name" title="${escapeHtml(p.model)}">${escapeHtml(p.model)}</div>${canWrite()?`<div class="row-actions"><button class="icon-btn minus" onclick="setStock(${p.id},-1)">−</button><button class="icon-btn plus" onclick="setStock(${p.id},1)">+</button><button class="icon-btn edit-btn" onclick="openEdit(${p.id})">✎</button><button class="delete-btn" onclick="confirmDelete(${p.id})">×</button></div>`:''}</div>${showStock?`<div class="cover-stock"><div class="stock-number">${p.stock}</div><div class="stock-label">Stock</div></div>`:''}</div>`).join('')}</div>`}
function productCards(){const arr=data.products.filter(p=>{const match=searchMatch(p.model,query);const f=filter==='all'||(filter==='in'&&p.stock>2)||(filter==='low'&&p.stock>0&&p.stock<=2)||(filter==='out'&&p.stock===0);return match&&f});return arr.length?coverRows(arr):`<div class="empty">No cover models found.</div>`}
function glassRow(g,serial){return `<div class="glass-row"><div class="serial">${serial}</div><div class="glass-info"><div class="model-name">${escapeHtml(g.name)}</div><div class="muted">Size: ${escapeHtml(g.size)} · ${g.models.length} models</div><div class="glass-models">${g.models.map((m,i)=>`<span class="glass-model">${query&&searchMatch(m,query)?highlightText(m,query):escapeHtml(m)}</span>${i<g.models.length-1?'<span class="glass-sep">•</span>':''}`).join('')}</div>${canWrite()?`<div class="glass-actions"><button class="icon-btn edit-btn" onclick="openGlassEdit(${g.id})">✎</button><button class="delete-btn" onclick="confirmGlassDelete(${g.id})">×</button></div>`:''}</div></div>`}
function glassResults(){const arr=data.glasses.filter(g=>!query.trim()||searchMatch([g.name,g.size,...g.models].join(' '),query));return arr.length?`<div class="cover-list">${arr.map((g,i)=>glassRow(g,i+1)).join('')}</div>`:`<div class="empty">No glass set found.</div>`}
function dashboardResults(){const q=query.trim(),covers=data.products.filter(p=>searchMatch(p.model,q)),glasses=data.glasses.filter(g=>searchMatch([g.name,g.size,...g.models].join(' '),q));return `<div class="search-result-title"><h2>Search Results</h2><span>${covers.length+glasses.length} matches</span></div>${covers.length?`<div class="result-block"><div class="result-label">COVERS</div>${coverRows(covers,false)}</div>`:''}${glasses.length?`<div class="result-block"><div class="result-label">UNIVERSAL GLASS</div><div class="cover-list">${glasses.map((g,i)=>glassRow(g,i+1)).join('')}</div></div>`:''}${!covers.length&&!glasses.length?`<div class="empty">No model found.</div>`:''}`}
function dashboard(){return `<div class="head"><div><h1>Dashboard</h1><div class="muted">Fast model lookup for your shop</div></div>${canWrite()?`<button class="btn primary" onclick="openProduct()">＋ Add Cover</button>`:''}</div><input class="search" id="mainSearch" placeholder="🔍  Search model..." oninput="searchLive(this)" value="${escapeHtml(query)}" autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false"><div class="home-cards"><button class="home-card" onclick="nav('stock')" aria-label="Open Covers"><img class="home-art" src="cover-thumb.png" alt="Covers - Manage cover models"></button><button class="home-card" onclick="nav('glass')" aria-label="Open Universal Glass"><img class="home-art" src="glass-thumb.png" alt="Universal Glass - Manage glass sets"></button></div><div class="section"><button class="btn secondary export-btn" onclick="exportOutOfStock()">⬇ Export Out-of-Stock Covers</button></div><div class="section live-results">${query?dashboardResults():''}</div></div>`}
function stock(){const c=counts();return `<div class="head"><div><h1>Covers</h1><div class="muted">${data.products.length} models · live stock</div></div>${canWrite()?`<button class="btn primary" onclick="openProduct()">＋ Add Model</button>`:''}</div><input class="search" id="mainSearch" placeholder="🔍 Smart search model..." oninput="searchLive(this)" value="${escapeHtml(query)}" autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false"><div class="filters"><button class="filter ${filter==='all'?'active':''}" onclick="filter='all';render()">All <b>${c.all}</b></button><button class="filter ${filter==='in'?'active':''}" onclick="filter='in';render()">Stock <b>${c.in}</b></button><button class="filter ${filter==='low'?'active':''}" onclick="filter='low';render()">Low Stock <b>${c.low}</b></button><button class="filter ${filter==='out'?'active':''}" onclick="filter='out';render()">Out of Stock <b>${c.out}</b></button></div><div class="live-results">${productCards()}</div></div>`}
function glass(){return `<div class="head"><div><h1>Universal Glass</h1><div class="muted">Search any compatible model to find its glass set</div></div>${canWrite()?`<button class="btn primary" onclick="openGlass()">＋ Add Set</button>`:''}</div><input class="search" id="mainSearch" placeholder="🔍 Smart search model or glass set..." oninput="searchLive(this)" value="${escapeHtml(query)}" autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false"><div class="section live-results">${glassResults()}</div></div>`}
async function loadHistory(){if(!cloudReady||!currentUser||!(role==='manager'||access==='full'))return;try{const snap=await fbDb.ref('phoneking/history').once('value');const cutoff=Date.now()-30*86400000;const rows=[];snap.forEach(s=>{const v=s.val();if(v&&(+v.createdAt||0)>=cutoff)rows.push(v)});rows.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));historyCache=rows;data.history=rows;saveLocal();if(page==='history')render()}catch(e){console.warn('History load failed',e);if(page==='history')render()}}
function historyPage(){const h=(historyCache.length?historyCache:data.history||[]).filter(x=>(x.createdAt||0)>=Date.now()-30*86400000).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));return `<div class="head"><div><h1>History</h1><div class="muted">Changes made in the last 30 days · user and time recorded</div></div></div>${h.length?`<div class="history">${h.map(e=>`<div class="event"><div class="event-top"><span class="event-user">${escapeHtml(e.userName||e.userEmail||'User')}</span><span class="muted">${new Date(e.createdAt).toLocaleString()}</span></div><div style="font-weight:800;margin-top:5px">${escapeHtml(e.action||'Change')}</div><div class="muted">${escapeHtml(e.entity||'')} · ${escapeHtml(e.details||'')}</div></div>`).join('')}</div>`:`<div class="empty">No changes recorded in the last 30 days.</div>`}`}
function staffPage(){if(role!=='manager')return `<div class="empty">Manager access required.</div>`;return `<div class="head"><div><h1>Staff Management</h1><div class="muted">Register users and control their access</div></div><button class="btn primary" onclick="openStaff()">＋ Register Staff</button></div><div class="card" style="background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px"><b>Access levels</b><div class="muted" style="margin-top:6px">View Only can search and view live data. Full Access can add, edit, delete and change stock. Every Full Access change is recorded in History.</div></div><div class="staff-list">${staffUsers.length?staffUsers.map(u=>staffRow(u)).join(''):'<div class="empty">No staff accounts yet.</div>'}</div>`}
let staffUsers=[];
function staffRow(u){const isManager=u.role==='manager';return `<div class="card staff-row"><div class="staff-main"><div class="staff-name">${escapeHtml(u.name||u.email||'User')} ${isManager?'<span class="tag full">MANAGER</span>':u.active===false?'<span class="tag off">REMOVED</span>':u.access==='full'?'<span class="tag full">FULL ACCESS</span>':'<span class="tag view">VIEW ONLY</span>'}</div><div class="staff-meta">${escapeHtml(u.email||'')} · ${u.createdAt?new Date(u.createdAt).toLocaleDateString():''}</div></div><div class="staff-actions">${!isManager&&u.active!==false?`<button class="btn ghost" onclick="changeAccess('${u.uid}','${u.access==='full'?'view':'full'}')">Make ${u.access==='full'?'View Only':'Full Access'}</button><button class="btn danger" onclick="confirmRemoveStaff('${u.uid}')">Remove</button>`:''}${!isManager&&u.active===false?`<button class="btn primary" onclick="reactivateStaff('${u.uid}')">Reactivate</button>`:''}</div></div>`}
function openStaff(){if(role!=='manager')return;openModal(`<div class="dialog"><div class="modalhead"><h2>Register New Staff</h2><button class="close" onclick="closeModal()">×</button></div><div class="formgrid"><div class="field full"><label>Staff name</label><input id="s_name" placeholder="e.g. Ahmed"></div><div class="field full"><label>Email</label><input id="s_email" type="email" placeholder="staff@example.com"></div><div class="field full"><label>Temporary password</label><input id="s_pass" type="password" placeholder="Minimum 6 characters"></div><div class="field full"><label>Access level</label><div class="choice-grid"><button id="choice_view" class="choice selected" onclick="selectAccess('view')"><b>👁 View Only</b><div class="muted">Search and view only</div></button><button id="choice_full" class="choice" onclick="selectAccess('full')"><b>⚡ Full Access</b><div class="muted">Manage stock and records</div></button></div></div></div><button class="btn primary" style="width:100%;margin-top:16px" onclick="createStaff()">Create Staff Account</button></div>`);window.newStaffAccess='view'}
function selectAccess(v){window.newStaffAccess=v;document.getElementById('choice_view')?.classList.toggle('selected',v==='view');document.getElementById('choice_full')?.classList.toggle('selected',v==='full')}
async function createStaff(){const name=document.getElementById('s_name').value.trim(),email=document.getElementById('s_email').value.trim().toLowerCase(),pass=document.getElementById('s_pass').value;if(!name||!email||pass.length<6)return alert('Enter name, valid email and a password of at least 6 characters.');try{if(!staffCreator){staffCreator=firebase.initializeApp(window.PHONEKING_FIREBASE_CONFIG,'staffCreator');staffCreatorAuth=staffCreator.auth()}const cred=await staffCreatorAuth.createUserWithEmailAndPassword(email,pass);await fbDb.ref('phoneking/users/'+cred.user.uid).set({uid:cred.user.uid,name,email,role:'staff',access:window.newStaffAccess||'view',active:true,createdAt:Date.now()});await staffCreatorAuth.signOut();await writeAudit('Staff registered','User: '+email,`${window.newStaffAccess==='full'?'Full Access':'View Only'}`);closeModal();await loadStaffUsers();render();alert('Staff account created successfully.')}catch(e){alert(e.message||'Could not create staff account.')}}
async function loadStaffUsers(){if(!cloudReady||role!=='manager')return;try{const snap=await fbDb.ref('phoneking/users').once('value');const vals=snap.val()||{};staffUsers=Object.entries(vals).map(([uid,v])=>({...v,uid}));const me={uid:currentUser.uid,email:currentUser.email,name:'Manager',role:'manager',active:true,createdAt:0};if(!staffUsers.some(x=>x.uid===me.uid))staffUsers.unshift(me);staffUsers.sort((a,b)=>(a.role==='manager'?-1:1)-(b.role==='manager'?-1:1)||(a.name||a.email||'').localeCompare(b.name||b.email||''));if(page==='staff')render()}catch(e){console.warn(e)}}
async function changeAccess(uid,newAccess){if(role!=='manager')return;try{await fbDb.ref('phoneking/users/'+uid).update({access:newAccess,updatedAt:Date.now()});const u=staffUsers.find(x=>x.uid===uid);await writeAudit('Staff access changed','User: '+(u?.email||uid),newAccess==='full'?'Full Access':'View Only');await loadStaffUsers()}catch(e){alert(e.message||'Could not change access.')}}
function confirmRemoveStaff(uid){if(role!=='manager')return;const u=staffUsers.find(x=>x.uid===uid);openModal(`<div class="dialog confirm"><div class="confirm-icon">×</div><h2>Remove staff access?</h2><p class="muted">${escapeHtml(u?.name||u?.email||'This user')} will be unable to access PhoneKing. Their previous history will remain.</p><div class="head-actions" style="justify-content:center;margin-top:17px"><button class="btn secondary" onclick="closeModal()">Cancel</button><button class="btn danger" onclick="removeStaff('${uid}')">Remove Access</button></div></div>`)}
async function removeStaff(uid){if(role!=='manager')return;try{const u=staffUsers.find(x=>x.uid===uid);await fbDb.ref('phoneking/users/'+uid).update({active:false,removedAt:Date.now()});await writeAudit('Staff access removed','User: '+(u?.email||uid),'Access revoked');closeModal();await loadStaffUsers();}catch(e){alert(e.message||'Could not remove staff.')}}
async function reactivateStaff(uid){if(role!=='manager')return;try{await fbDb.ref('phoneking/users/'+uid).update({active:true,reactivatedAt:Date.now()});await loadStaffUsers()}catch(e){alert(e.message||'Could not reactivate staff.')}}
function exportOutOfStock(){const rows=data.products.filter(p=>+p.stock===0),csv=[['Serial','Model','Stock'],...rows.map((p,i)=>[i+1,p.model,0])].map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='phoneking-out-of-stock-covers-'+new Date().toISOString().slice(0,10)+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function render(){const root=document.body;const old=document.querySelector('.app');if(old)old.remove();const oldLogin=document.querySelector('.login');if(oldLogin)oldLogin.remove();if(!role){root.insertAdjacentHTML('beforeend',login());return}root.insertAdjacentHTML('beforeend',app());}
function nav(p){if(p==='staff'&&role!=='manager')return;if(p==='history'&&!(role==='manager'||access==='full'))return;const active=document.activeElement;if(active&&/^(INPUT|TEXTAREA|SELECT)$/.test(active.tagName))active.blur();page=p;query='';filter='all';render();if(p==='history')loadHistory()}
function searchLive(el){query=el.value;updateLiveResults()}
function updateLiveResults(){const box=document.querySelector('.live-results');if(!box)return;if(page==='glass')box.innerHTML=glassResults();else if(page==='stock')box.innerHTML=productCards();else if(page==='dashboard')box.innerHTML=query?dashboardResults():''}
function navIcon(type){const icons={dashboard:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5v9a1.5 1.5 0 0 1-1.5 1.5H4.5A1.5 1.5 0 0 1 3 19.5v-9Z"/><path d="M9 21v-6h6v6"/></svg>',stock:'<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="3" width="10" height="18" rx="2"/><circle cx="12" cy="17.5" r=".8"/></svg>',glass:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.2 20 6v5.3c0 4.7-3.1 8.1-8 9.5-4.9-1.4-8-4.8-8-9.5V6l8-2.8Z"/></svg>',history:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 5v5h5"/><path d="M12 7v5l3 2"/></svg>',staff:'<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="7" r="3.2"/><path d="M5 21v-2.2A4.8 4.8 0 0 1 9.8 14h4.4a4.8 4.8 0 0 1 4.8 4.8V21"/></svg>'};return icons[type]||''}function navItems(){const items=[['dashboard','Dashboard'],['stock','Covers'],['glass','Glass']];if(role==='manager'||access==='full')items.push(['history','History']);if(role==='manager')items.push(['staff','Staff']);return items}
function navs(){return navItems().map(x=>`<button class="nav ${page===x[0]?'active':''}" onclick="nav('${x[0]}')"><span class="nav-icon">${navIcon(x[0])}</span><span class="nav-label">${x[1]}</span></button>`).join('')}
function app(){let content=page==='dashboard'?dashboard():page==='stock'?stock():page==='glass'?glass():page==='history'?historyPage():staffPage();return `<div class="app"><header class="top"><div class="brand">PHONE<span class="king">KING</span> <span class="stockword">STOCK</span></div><div class="rolepill">${role==='manager'?'👤 Manager':access==='full'?'⚡ Full Access':'👁 View Only'} · <button style="border:0;background:transparent;color:#fff;padding:0" onclick="logout()">Logout</button></div></header><div class="layout"><aside class="side">${navs()}</aside><main class="main">${content}</main></div><nav class="mobilebar">${navItems().map(x=>`<button class="${page===x[0]?'active':''}" onclick="nav('${x[0]}')" aria-label="${x[1]}"><span class="nav-icon">${navIcon(x[0])}</span><span class="nav-label">${x[1]}</span></button>`).join('')}</nav></div>`}
function login(){return `<div class="login"><div class="loginbox"><div class="brand" style="font-size:25px;color:#202124">PHONE<span class="king">KING</span> <span class="stockword">STOCK</span></div><p class="muted">Secure cloud stock management</p><h2>Sign in</h2><div class="field"><label>Email</label><input id="login_email" type="email" placeholder="manager@example.com" autocomplete="username"></div><div class="field" style="margin-top:11px"><label>Password</label><input id="login_pass" type="password" placeholder="Password" autocomplete="current-password"></div><button class="btn primary" style="width:100%;margin-top:15px" onclick="cloudLogin()">Login</button><p class="mini-note" style="margin-top:12px">Access is controlled by Firebase Authentication and Realtime Database rules.</p></div></div>`}
async function cloudLogin(){if(!cloudReady)return alert('Firebase could not be initialized. Open the hosted app and enable Email/Password Authentication.');const email=document.getElementById('login_email').value.trim(),pass=document.getElementById('login_pass').value;try{await fbAuth.signInWithEmailAndPassword(email,pass)}catch(e){alert(e.message||'Login failed')}}
async function resolveAccess(u){if(!u)return null;if((u.email||'').toLowerCase()===(window.PHONEKING_FIREBASE_CONFIG.managerEmail||'').toLowerCase())return{role:'manager',access:'full'};const snap=await fbDb.ref('phoneking/users/'+u.uid).once('value');const v=snap.val();if(!v||v.role!=='staff'||v.active===false)return null;return{role:'staff',access:v.access==='full'?'full':'view',record:v}}
async function onAuth(u){currentUser=u;if(userUnsub){userUnsub();userUnsub=null}if(!u){role='';access='view';render();return}try{const a=await resolveAccess(u);if(!a){alert('Your PhoneKing access has been removed or is not registered.');await fbAuth.signOut();return}role=a.role;access=a.access;const snap=await fbDb.ref('phoneking/data').once('value');if(snap.exists())data=normalizeData(snap.val());else if(role==='manager')await fbDb.ref('phoneking/data').set(data);saveLocal();fbDb.ref('phoneking/data').on('value',s=>{if(s.exists()){data=normalizeData(s.val());saveLocal();if(role)updateLiveResults()}});if(role==='manager'){await loadStaffUsers();userUnsub=fbDb.ref('phoneking/users').on('value',()=>loadStaffUsers())}else{userUnsub=fbDb.ref('phoneking/users/'+u.uid).on('value',s=>{const v=s.val();if(!v||v.active===false){alert('Your PhoneKing access has been removed.');fbAuth.signOut()}else{access=v.access==='full'?'full':'view';render()}})}await loadHistory();render()}catch(e){console.error(e);alert('Cloud connection failed. Check Firebase configuration and rules.');await fbAuth.signOut()}}
function logout(){if(cloudReady)fbAuth.signOut();else{role='';render()}}
function openModal(html){document.getElementById('modal').classList.add('show');document.getElementById('modal').innerHTML=html}
function closeModal(){document.getElementById('modal').classList.remove('show');document.getElementById('modal').innerHTML=''}
